services:
  db:
    image: postgres:18-alpine
    container_name: hplus-analytics-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - hplus_analytics_postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - hplus_analytics

  app:
    build: .
    container_name: hplus-analytics-app
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      NODE_ENV: production
      APP_ORIGIN: ${APP_ORIGIN:?APP_ORIGIN is required}
      UPLOAD_DIR: /app/data/uploads
      GOOGLE_DRIVE_AUTOMATION_ENV: production
      GOOGLE_DRIVE_AUTOMATION_ENABLED: "true"
      GOOGLE_DRIVE_CREDENTIALS_PATH: /run/secrets/google-drive-production-service-account.json
    command: ["npm", "start"]
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - hplus_analytics_uploads:/app/data/uploads
      - /opt/hplus-analytics/secrets/google-drive-production-service-account.json:/run/secrets/google-drive-production-service-account.json:ro
    networks:
      - hplus_analytics

volumes:
  hplus_analytics_postgres:
    name: hplus_analytics_postgres
  hplus_analytics_uploads:
    name: hplus_analytics_uploads

networks:
  hplus_analytics:
    name: hplus_analytics_network
